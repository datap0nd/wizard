# Reference CI. The plan requires an approved internal runner; this workflow is the template to port there.
# Offline only: SYNTHETIC fixtures, replay runtime, the real Gemini CLI with fake model replies. No corporate access.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A throwaway PostgreSQL for the materialized-view export test (tests/integration/test_postgres_real.py).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: wizard-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CI: "true"
      WIZARD_TEST_PG_HOST: 127.0.0.1
      WIZARD_TEST_PG_USER: postgres
      WIZARD_TEST_PG_PASSWORD: wizard-ci
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Python dependencies (locked)
        run: uv sync --frozen

      - name: Web dependencies (locked) and browser
        run: |
          npm --prefix apps/web ci --no-audit --no-fund
          npx --prefix apps/web playwright install --with-deps chromium

      - name: Pinned Gemini CLI for offline fake-response tests
        run: |
          mkdir -p .tools
          echo '{"name":"wizard-dev-tools","private":true}' > .tools/package.json
          npm --prefix .tools install --no-audit --no-fund @google/gemini-cli@0.62.0

      - name: Verify all layers (fail closed; live parity cannot run here)
        run: bash scripts/verify_all.sh --allow-blocked=live-parity

      # The committed apps/web/dist must be built with the native Tailwind binary. On a PC where Application Control
      # blocks it, take this artifact instead (gh run download <id> -n web-dist -D apps/web/dist) and commit it.
      - name: Build the web app (native toolchain)
        if: always()
        run: npm --prefix apps/web run build

      - name: Keep the built web app
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist/
          include-hidden-files: true
          retention-days: 14

      - name: Keep verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-logs
          path: artifacts/verify/
          retention-days: 14
