# The desktop app: WizardBar (C#, WebView2) + the portable Python service, packaged by Inno Setup as WizardSetup.exe.
# Every push and pull request builds and smoke-tests the installer on Windows. A push to main also publishes it to the
# desktop-continuous release, where the in-app updater (WizardBar/Updater.cs) finds it. No credentials are involved:
# company settings travel separately in wizard.provision (docs/desktop.md).
name: desktop

on:
  pull_request:
  push:
    branches: [main, "claude/**"]  # claude/** : agent branches get the Windows build before any PR exists
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Version
        shell: pwsh
        run: |
          "WIZARD_DESKTOP_VERSION=1.0.${{ github.run_number }}" >> $env:GITHUB_ENV

      - name: Build WizardBar
        shell: pwsh
        run: |
          dotnet build apps/desktop/WizardBar/WizardBar.csproj -c Release `
            "-p:Version=$env:WIZARD_DESKTOP_VERSION" "-p:FileVersion=$env:WIZARD_DESKTOP_VERSION.0" `
            "-p:InformationalVersion=${{ github.sha }}" -o artifacts/desktop/payload/bar
          if ($LASTEXITCODE -ne 0) { throw "WizardBar build failed" }
          foreach ($file in @('WizardBar.exe', 'Microsoft.Web.WebView2.Core.dll', 'Microsoft.Web.WebView2.WinForms.dll',
                              'runtimes/win-x64/native/WebView2Loader.dll')) {
            if (-not (Test-Path "artifacts/desktop/payload/bar/$file")) { throw "Missing $file in the WizardBar build" }
          }
          $v = (Get-Item artifacts/desktop/payload/bar/WizardBar.exe).VersionInfo
          $version = "$($v.FileMajorPart).$($v.FileMinorPart).$($v.FileBuildPart).$($v.FilePrivatePart)"
          if ($version -ne "$env:WIZARD_DESKTOP_VERSION.0") { throw "WizardBar.exe has version $version" }

      - name: Draw the button (every look, with the pixel wizard from the embedded sprite sheet)
        shell: pwsh
        run: |
          $run = Start-Process -FilePath artifacts/desktop/payload/bar/WizardBar.exe -ArgumentList '--snapshot', "$PWD/artifacts/desktop/snapshot" -Wait -PassThru
          if ($run.ExitCode -ne 0) { throw "WizardBar --snapshot exited with $($run.ExitCode)" }
          foreach ($name in @('button-100.png', 'button-200.png')) {
            if ((Get-Item "artifacts/desktop/snapshot/$name").Length -lt 2000) { throw "$name is empty" }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: WizardBar-button
          path: artifacts/desktop/snapshot
          retention-days: 14

      - name: Assemble the payload (portable Python + locked libraries, SHA-256 checked)
        shell: pwsh
        run: python scripts/build_desktop_payload.py --out artifacts/desktop/payload --commit ${{ github.sha }} --version "$env:WIZARD_DESKTOP_VERSION.0"

      # The same checksum-verified archives, for the portable runtime release setup.ps1 installs from (published by the
      # publish job when the locks name a release that does not exist yet, e.g. after a new dependency).
      - uses: actions/upload-artifact@v4
        with:
          name: portable-runtime
          path: |
            artifacts/desktop/downloads/*.whl
            artifacts/desktop/downloads/*.zip
          retention-days: 3

      - name: Smoke-test the packaged service on Windows
        shell: pwsh
        run: |
          $python = Resolve-Path artifacts/desktop/payload/runtime/python/python.exe
          $run = Resolve-Path artifacts/desktop/payload/app/run.py
          $home_ = Join-Path $env:RUNNER_TEMP 'wizard-home'
          $env:WIZARD_PORT = '8781'
          $env:WIZARD_CONTROL_TOKEN = 'ci-control-token-0123456789abcdef0123456789'
          $env:WIZARD_PROXY = 'direct'
          $service = Start-Process -FilePath $python -ArgumentList "-X utf8 `"$run`" --home `"$home_`" --desktop" -PassThru -NoNewWindow
          $ready = $false
          for ($i = 0; $i -lt 120 -and -not $service.HasExited; $i++) {
            try { if ((Invoke-WebRequest http://127.0.0.1:8781/api/v1/health -UseBasicParsing -TimeoutSec 2).StatusCode -eq 200) { $ready = $true; break } } catch { }
            Start-Sleep -Milliseconds 500
          }
          if (-not $ready) { Get-Content (Join-Path $home_ 'logs/wizard.log') -ErrorAction SilentlyContinue; throw 'The packaged service did not start' }
          $headers = @{ 'X-Wizard-Control' = $env:WIZARD_CONTROL_TOKEN; 'X-Wizard-Request' = '1' }
          $status = Invoke-RestMethod http://127.0.0.1:8781/internal/v1/desktop/status -Headers $headers
          if ($status.runtime -ne 'code-assist') { throw "Unexpected runtime $($status.runtime)" }
          $page = Invoke-WebRequest http://127.0.0.1:8781/quick -UseBasicParsing
          if ($page.Content -notmatch '<div id="root">') { throw 'The web app is not served' }
          Invoke-RestMethod http://127.0.0.1:8781/internal/v1/desktop/stop -Method Post -Headers $headers -ContentType 'application/json' -Body '{}' | Out-Null
          if (-not $service.WaitForExit(30000)) { $service.Kill(); throw 'The service did not stop when asked' }
          Write-Host "Packaged service started, served /quick and stopped (exit $($service.ExitCode))."

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Build WizardSetup.exe
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:WIZARD_DESKTOP_VERSION" installer\Wizard.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

      - name: Smoke-test a silent install and uninstall
        shell: pwsh
        run: |
          $setup = Resolve-Path artifacts/desktop/WizardSetup.exe
          $p = Start-Process $setup -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /NOLAUNCH=1 /TASKS=""' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Setup exited with $($p.ExitCode)" }
          $app = Join-Path $env:LOCALAPPDATA 'Programs\Wizard'
          foreach ($file in @('bar\WizardBar.exe', 'app\run.py', 'runtime\python\python.exe', 'app\apps\web\dist\index.html')) {
            if (-not (Test-Path (Join-Path $app $file))) { throw "Not installed: $file" }
          }
          $build = Get-Content (Join-Path $app 'app\BUILD.json') -Raw | ConvertFrom-Json
          if ($build.version -ne "$env:WIZARD_DESKTOP_VERSION.0") { throw "BUILD.json says version $($build.version)" }
          & (Join-Path $app 'runtime\python\python.exe') (Join-Path $app 'app\run.py') --home (Join-Path $env:RUNNER_TEMP 'check-home') --check
          if ($LASTEXITCODE -ge 2) { throw "Installed Wizard failed its check" }
          $u = Start-Process (Join-Path $app 'unins000.exe') -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART' -PassThru -Wait
          if ($u.ExitCode -ne 0) { throw "Uninstall exited with $($u.ExitCode)" }
          Write-Host 'Installed, checked and uninstalled.'

      - name: Release manifest
        shell: pwsh
        run: |
          $setup = Get-Item artifacts/desktop/WizardSetup.exe
          # The numeric file version, as the updater reads it (Inno's version text says 1.0.N, the number is 1.0.N.0).
          $v = $setup.VersionInfo
          $version = "$($v.FileMajorPart).$($v.FileMinorPart).$($v.FileBuildPart).$($v.FilePrivatePart)"
          if ($version -ne "$env:WIZARD_DESKTOP_VERSION.0") { throw "WizardSetup.exe has version $version" }
          $manifest = [ordered]@{
            version = $version; commit = '${{ github.sha }}'; installer = 'WizardSetup.exe'
            installer_sha256 = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant(); size = $setup.Length
          }
          $manifest | ConvertTo-Json | Set-Content artifacts/desktop/wizard-desktop.json -Encoding utf8NoBOM
          Get-Content artifacts/desktop/wizard-desktop.json

      - uses: actions/upload-artifact@v4
        with:
          name: WizardSetup
          path: |
            artifacts/desktop/WizardSetup.exe
            artifacts/desktop/wizard-desktop.json
          retention-days: 14

      - name: Show the button at 100 % (base64 PNG, last in the log so it can be read without the artifact)
        shell: pwsh
        run: |
          "----- button-100.png base64 -----"
          [Convert]::ToBase64String([IO.File]::ReadAllBytes("$PWD/artifacts/desktop/snapshot/button-100.png"))
          "----- end -----"

  publish:
    needs: installer
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: desktop-publish
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            runtime.lock.json
            dependencies.lock.json
            portable_assets.lock.json
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          name: portable-runtime
          path: portable
      - name: Publish the portable runtime release when the locks name a new one
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag=$(python3 -c 'import json; print(json.load(open("portable_assets.lock.json"))["release_tag"])')
          if gh release view "$tag" >/dev/null 2>&1; then echo "Release $tag exists."; exit 0; fi
          # Exactly the locked files, each with its locked SHA-256.
          files=$(python3 - <<'PY'
          import hashlib, json, pathlib, sys
          items = [json.load(open("runtime.lock.json"))] + json.load(open("dependencies.lock.json"))["packages"]
          for item in items:
              path = pathlib.Path("portable") / item["filename"]
              if path.name != item["filename"] or not path.is_file():
                  sys.exit(f"missing {item['filename']}")
              if hashlib.sha256(path.read_bytes()).hexdigest() != item["sha256"]:
                  sys.exit(f"checksum mismatch for {item['filename']}")
              print(path)
          PY
          )
          gh release create "$tag" --latest=false --title "Portable runtime $tag" \
            --notes "Portable Python and locked wheels for work-PC installs (setup.ps1). Do not delete." $files
          echo "Published $tag."
      - uses: actions/download-artifact@v4
        with:
          name: WizardSetup
          path: dist
      - name: Publish to the desktop-continuous release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view desktop-continuous >/dev/null 2>&1 || gh release create desktop-continuous --latest=false \
            --target "${{ github.sha }}" --title "Wizard desktop (continuous)" \
            --notes "WizardSetup.exe from the newest main. Wizard's Update menu installs it; see docs/desktop.md."
          # Never replace a newer build (two pushes in a row can finish out of order).
          published=$(gh release download desktop-continuous -p wizard-desktop.json -O - 2>/dev/null || echo '{"version": "0"}')
          if ! python3 -c 'import json, sys; v = lambda s: tuple(int(x) for x in json.loads(s)["version"].split("."))
          sys.exit(0 if v(open("dist/wizard-desktop.json").read()) > v(sys.argv[1]) else 1)' "$published"; then
            echo "The release already has a newer build; nothing published."; exit 0
          fi
          # Installer first, manifest last: an updater reading the new manifest then finds the matching installer.
          gh release upload desktop-continuous dist/WizardSetup.exe --clobber
          gh release upload desktop-continuous dist/wizard-desktop.json --clobber
          echo "published=true" >> "$GITHUB_OUTPUT"
      # Some office proxies open github.com but time out on release downloads (release-assets.githubusercontent.com).
      # A branch zip comes from codeload.github.com instead, so the README links this branch as the alternative. One
      # force-pushed commit: older installers drop out of the branch.
      - name: Mirror the installer to the desktop-download branch
        if: steps.release.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mirror=$(mktemp -d)
          cp dist/WizardSetup.exe dist/wizard-desktop.json "$mirror"/
          cat > "$mirror/README.md" <<'EOF'
          # Wizard desktop installer (download mirror)

          `WizardSetup.exe` from the newest `main`, the same file as the
          [desktop-continuous release](https://github.com/datap0nd/wizard/releases/tag/desktop-continuous);
          `wizard-desktop.json` names its version, commit and SHA-256.

          Download: <https://github.com/datap0nd/wizard/archive/refs/heads/desktop-download.zip>

          This branch is for networks that open github.com but time out on release downloads
          (`release-assets.githubusercontent.com`): the branch zip comes from `codeload.github.com` instead. The `desktop`
          workflow replaces the branch with a single commit on every release, so do not commit here.
          EOF
          version=$(python3 -c 'import json; print(json.load(open("dist/wizard-desktop.json"))["version"])')
          cd "$mirror"
          git init -q -b desktop-download
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "WizardSetup.exe $version (${GITHUB_SHA::7})"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git" desktop-download
