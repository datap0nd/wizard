[project]
name = "wizard"
version = "0.1.0"
description = "Permission-aware executive analyst: Gemini (enterprise sign-in) chooses read-only source tools; Wizard owns identity, tool boundaries, evidence and reports."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "pydantic>=2.9",
  "httpx>=0.28",
  # Verify HTTPS against the OS certificate store (corporate TLS inspection), as the data-governance app does.
  "truststore>=0.10",
  # Office automation (PowerPoint, Excel, Word, Outlook) for documents and chat attachments; opens NASCA-protected files
  # through Office for the signed-in user, as the data-governance app does.
  "pywin32>=306; sys_platform == 'win32'",
  # Read-only PostgreSQL catalog export for the documentation kit. Pure Python: Application Control has no driver DLL to
  # block (psycopg2's was blocked on a development PC).
  "pg8000>=1.31",
  # Wizard's own browser for the company portals (ASAP, GSCM, BDP): Playwright drives the installed Google Chrome (or
  # Edge) under the person's own sign-in, as the data-governance app's Flows do. The wheel carries its driver; no
  # browser is downloaded. The same version as Metronome's Flows, whose driver already runs on the work PCs.
  "playwright==1.62.0",
  # Edits a copy of an attached workbook when Excel is not available (Excel itself edits it on the work PC). Pure
  # Python; the same version Metronome's Flows use.
  "openpyxl==3.1.5",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
  "mypy>=1.13",
  "jsonschema>=4.23",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "services/api/wizard_api",
  "services/agent/wizard_agent",
  "services/connectors/wizard_connectors",
  "services/checks/wizard_checks",
  "services/documents/wizard_documents",
]

[tool.hatch.build]
dev-mode-dirs = ["services/api", "services/agent", "services/connectors", "services/checks", "services/documents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["services/api", "services/agent", "services/connectors", "services/checks", "services/documents", "."]
markers = [
  "gemini_cli: runs the real Gemini CLI with fake model responses (needs WIZARD_GEMINI_CLI_JS or .tools)",
  "live: needs live corporate sources or a signed-in Gemini account; reported as BLOCKED when not configured",
  "postgres: needs a PostgreSQL test server (WIZARD_TEST_PG_*; CI runs one); reported as BLOCKED when not configured",
  "browser: drives a real Chromium or Chrome against a simulated portal (WIZARD_TEST_BROWSER or Playwright's cache); BLOCKED without one",
]
addopts = "-q -p no:cacheprovider -p no:tmpdir"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["services/api", "services/agent", "services/connectors", "services/checks", "services/documents", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101", "S603", "S607", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S107", "S108", "B011"]
"scripts/**" = ["S311"]
# Catalog-only SQL built from quoted catalog names (see the module docstring), never from model or user text.
"services/documents/wizard_documents/postgres.py" = ["S608"]
# Gemini writes the query by design; the read-only transaction and account are the boundary (module docstring).
"services/connectors/wizard_connectors/postgres_query.py" = ["S608"]
# The Brain page's fixed news queries, built from catalog names quoted with quote()/literal(), never from model or
# user text; they run through PostgresQuery's read-only transaction (module docstring).
"services/api/wizard_api/brain.py" = ["S608"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
files = ["services"]
